name: Build APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Your wss:// address
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q P2PChat.zip
      - run: sed -i "s#const val URL = \".*\"#const val URL = \"$URL\"#" P2PChat/app/src/main/java/com/example/p2pchat/Signaling.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: P2PChat
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: P2PChat/app/build/outputs/apk/debug/app-debug.apk
